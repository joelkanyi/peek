# CI: check every module, verify the plugin configuration, and build the plugin zip.
# Lean and cost-optimized: Linux only, no macOS runners, no binary plugin verifier,
# no Qodana. Runs on pushes to main and on pull requests.
name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      # The IntelliJ IDE download + Gradle caches exceed the default runner disk,
      # so reclaim space first. Keep the preinstalled Android SDK (android: false)
      # since the Android modules use it; free the rest.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check and build
        run: ./gradlew spotlessCheck apiCheck test :plugin:verifyPluginProjectConfiguration :plugin:buildPlugin

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: peek-plugin
          path: plugin/build/distributions/*.zip
